<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Clubs & Events</title>

<style>
/* ---------- GLOBAL ---------- */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;

    /* soft gradient background */
    background: linear-gradient(135deg, #cfd9df, #a1c4fd);

    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------- MAIN GLASS CONTAINER ---------- */
.main-container {
    width: 75%;
    max-width: 900px;
    padding: 50px;

    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);

    text-align: center;
}

/* ---------- HEADINGS ---------- */
.main-container h1 {
    margin-bottom: 10px;
    font-size: 32px;
    color: #222;
}

.main-container p {
    font-size: 17px;
    color: #333;
    margin-bottom: 50px;
}

/* ---------- LOGIN CARD ---------- */
.login-card {
    width: 420px;
    margin: auto;
    padding: 40px;

    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

.login-card h2 {
    margin-bottom: 25px;
    color: #222;
}

/* ---------- BUTTONS ---------- */
.button-group {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.btn {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;

    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: 0.3s;
}

/* student */
.btn-student {
    background: #1e88e5;
    color: white;
}

/* admin */
.btn-admin {
    background: #fbc02d;
    color: #222;
}

.btn:hover {
    transform: translateY(-4px);
    opacity: 0.95;
}

/* ---------- FOOTER TEXT ---------- */
.footer-text {
    margin-top: 35px;
    font-size: 13px;
    color: #444;
}
</style>
</head>

<body>

<div class="main-container">

    <h1>College Clubs & Events Management Platform</h1>
    <p>
        A centralized platform for students and club admins to manage clubs,
        events, participation, and engagement efficiently.
    </p>

    <div class="login-card">
        <h2>Login</h2>
        <p>Select Your Role</p>

               <div class="button-group">
            <a href="login_student.html" style="text-decoration:none;">
                <button class="btn btn-student">Login</button>
            </a>

            <a href="super_admin_login.html" style="text-decoration:none;">
                <button class="btn" style="background: #9c27b0; color: white;">Super Admin</button>
            </a>
        </div>
        
    <div class="footer-text">
        © 2026 College Club Management System
    </div>

</div>

</body>
<script src="js/student_admin.js"></script>
</html>
