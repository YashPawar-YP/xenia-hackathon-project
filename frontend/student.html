<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>

<style>
/* ---------- GLOBAL ---------- */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    height: 100vh;
    background: linear-gradient(135deg, #cfd9df, #a1c4fd);
    overflow-x: hidden;
}

/* ---------- MAIN CONTENT ---------- */
.main-container {
    width: 55%;
    max-width: 900px;
    margin: 80px auto;
    padding: 50px;

    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.main-container h1 {
    color: #934b4b;
    margin-bottom: 10px;
}s

.main-container p {
    color: #333;
    font-size: 17px;
    margin-bottom: 40px;
}

/* ---------- BUTTON ---------- */
.primary-btn {
    padding: 14px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #1e88e5;
    color: white;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: 0.3s;
}

.primary-btn:hover {
    transform: translateY(-4px);
    background: #1565c0;
}

.back-btn {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #6c757d;
    color: white;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: 0.3s;
    margin-bottom: 20px;
}

.back-btn:hover {
    transform: translateY(-2px);
    background: #5a6268;
}

/* ---------- FLOATING SIDEBAR ---------- */
/* REMOVED - Sidebar panel functionality removed */

/* ---------- REGISTER BUTTON (TOP LEFT) ---------- */
.register-btn-top {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 12px 24px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #4caf50;
    color: white;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: 0.3s;
    z-index: 10;
}

.register-btn-top:hover {
    transform: translateY(-2px);
    background: #45a049;
}

/* ---------- MODAL ---------- */
.modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: rgba(255, 255, 255, 0.98);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.3);
    width: 90%;
    max-width: 500px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    color: #1e88e5;
    margin: 0;
}

.close-btn {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #999;
    transition: 0.3s;
}

.close-btn:hover {
    color: #333;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #1e88e5;
    box-shadow: 0 0 5px rgba(30, 136, 229, 0.3);
}

.modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 25px;
}

.modal-footer button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
}

.submit-btn {
    background: #4caf50;
    color: white;
}

.submit-btn:hover {
    background: #45a049;
}

.cancel-btn {
    background: #999;
    color: white;
}

.cancel-btn:hover {
    background: #777;
}

/* ---------- FOOTER ---------- */
.footer-text {
    margin-top: 40px;
    font-size: 13px;
    color: #444;
}
</style>
</head>

<body>

<!-- MAIN CONTENT -->
<div class="main-container">
    <a href="login_student.html" style="text-decoration:none;">
        <button class="back-btn">← Back to Login</button>
    </a>
    <h1 id="greeting"></h1>
    <p>
        Welcome to your student dashboard. Explore clubs, join events,
        and track your participation and feedback — all in one place.
    </p>

    <div style="display: flex; gap: 15px; margin-bottom: 30px;">
        <a href="clublist.html" style="text-decoration:none; flex: 1;">
            <button class="primary-btn" style="width: 100%;">Explore & Join Clubs</button>
        </a>
        <a href="events_list.html" style="text-decoration:none; flex: 1;">
            <button class="primary-btn" style="width: 100%; background: #ff9800;">Browse Events</button>
        </a>
    </div>

    <div class="footer-text">
        My Clubs | Events | Community
    </div>
</div>

<!-- ---------- JS ---------- -->
<script>
const hour = new Date().getHours();
let greet = "Welcome";
let studentName = "Guest";
let userId = null;

if (hour < 12) greet = "Good Morning";
else if (hour < 18) greet = "Good Afternoon";
else greet = "Good Evening";

// Initialize page
document.getElementById("greeting").innerText =
    greet + ", " + studentName + " 👋";
</script>

</body>
</html>
