<!DOCTYPE html>
<html>
<head>
    <title>Add Club</title>
</head>
<body>

    <h1>Add Club</h1>

    <!-- Club Form -->
    <form id="addClubForm">

        <!-- Club Name -->
        <label>Club Name:</label><br>
        <input type="text" id="clubName" name="club_name"><br><br>

        <!-- Club Description -->
        <label>Club Description:</label><br>
        <textarea name="club_description" rows="4" cols="40" id="clubDescription"></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

    </form>

    <br>

    <!-- Back to Admin Dashboard -->
    <a href="admin.html">Back to Dashboard</a>
    <script src="js/add_club.js"></script>
</body>
</html>
