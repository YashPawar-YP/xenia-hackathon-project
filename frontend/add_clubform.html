<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Club</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ede7f6, #d1c4e9);
            font-family: "Roboto", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: #fff;
            width: 420px;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            margin: 0 0 20px;
            color: #673ab7;
            font-size: 28px;
            font-weight: 500;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #673ab7;
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            background: #673ab7;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5e35b1;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            color: #673ab7;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Add Club</h1>

        <form>
            <div class="form-group">
                <label for="clubName">Club Name</label>
                <input type="text" id="clubName" placeholder="Enter club name">
            </div>

            <div class="form-group">
                <label for="clubDesc">Club Description</label>
                <textarea id="clubDesc" placeholder="Enter club description"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>

        <a href="student.html" class="back-link">Back to Dashboard</a>
    </div>

</body>
</html>
