<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Club Page</title>

    <style>
        body {
            font-family: Georgia, serif;
            padding: 30px;
            background: linear-gradient(135deg, #e0f2fe, #fce7f3);
        }

        .club-name {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .placeholder {
            color: #777;
            font-style: italic;
        }

        .section {
            margin-top: 25px;
        }

        textarea {
            width: 320px;
            height: 80px;
            margin-top: 8px;
            padding: 6px;
        }

        button {
            margin-top: 8px;
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div style="margin-bottom: 20px;">
    <a href="student_dashboard.html">
        <button>Home</button>
    </a>
</div>

<!-- CLUB NAME -->
<h1 id="clubName" class="club-name placeholder">Club Name</h1>

<!-- DESCRIPTION -->
<div class="section">
    <label><strong>Description</strong></label><br>
    <textarea id="clubDesc" class="placeholder" readonly>
Club description will appear here
    </textarea>
</div>

<!-- ABOUT -->
<div class="section">
    <h2>About the Club</h2>
    <p id="aboutText" class="placeholder">
        About the club information will appear here.
    </p>
</div>

<!-- WHAT WE DO -->
<div class="section">
    <h2>What We Do</h2>
    <ul id="workList" class="placeholder">
        <li>Activities will appear here.</li>
    </ul>
</div>

<!-- EVENTS -->
<div class="section">
    <h2>Upcoming Events</h2>
    <ul id="eventList" class="placeholder">
        <li>Events will appear here.</li>
    </ul>
</div>

<!-- JOIN -->
<div class="section">
    <p>Become a part of the community.</p>
    <button>Request to Join</button>
</div>

<!-- FEEDBACK -->
<div class="section">
    <h3>Give Feedback</h3>
    <textarea placeholder="Write your feedback..."></textarea>
</div>

<script>
fetch("/api/getClub.php?id=1")
  .then(res => res.json())
  .then(clubData => {

    /* CLUB NAME */
    if (clubData.name && clubData.name.trim() !== "") {
        const nameEl = document.getElementById("clubName");
        nameEl.textContent = clubData.name;
        nameEl.classList.remove("placeholder");
    }

    /* DESCRIPTION */
    if (clubData.description && clubData.description.trim() !== "") {
        const descEl = document.getElementById("clubDesc");
        descEl.value = clubData.description;
        descEl.classList.remove("placeholder");
    }

    /* ABOUT */
    if (clubData.about && clubData.about.trim() !== "") {
        const aboutEl = document.getElementById("aboutText");
        aboutEl.textContent = clubData.about;
        aboutEl.classList.remove("placeholder");
    }

    /* WHAT WE DO */
    if (clubData.activities && clubData.activities.length > 0) {
        const ul = document.getElementById("workList");
        ul.innerHTML = "";
        ul.classList.remove("placeholder");

        clubData.activities.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            ul.appendChild(li);
        });
    }

    /* EVENTS */
    if (clubData.events && clubData.events.length > 0) {
        const ul = document.getElementById("eventList");
        ul.innerHTML = "";
        ul.classList.remove("placeholder");

        clubData.events.forEach(event => {
            const li = document.createElement("li");
            li.textContent = event;
            ul.appendChild(li);
        });
    }
  });
</script>

</body>
</html>
